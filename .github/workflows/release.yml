name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  test-matrix:
    name: Verify Matrix (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Lint check with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy (strict)
        run: mypy --strict src tests

      - name: Security scan with bandit
        run: bandit -r src/vigilo/ -s B112

      - name: Dependency vulnerability audit with pip-audit
        run: pip-audit --local

      - name: Run test suite with pytest
        run: pytest -v --strict-markers

  build-pypi:
    name: Build sdist & wheel
    needs: [test-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution packages
        run: python -m build

      - name: Verify packages with twine
        run: twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [test-matrix, build-pypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vigilo
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-executables:
    name: Build Standalone Binary (${{ matrix.os }})
    needs: [test-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_name: vigilo-linux-x86_64
            ext: ""
          - os: macos-latest
            bin_name: vigilo-macos
            ext: ""
          - os: windows-latest
            bin_name: vigilo-windows-x86_64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --clean --name vigilo src/vigilo/cli.py --collect-all tree_sitter --collect-all tree_sitter_javascript --collect-all tree_sitter_typescript


      - name: Rename and move binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin_dist
          mv dist/vigilo bin_dist/${{ matrix.bin_name }}${{ matrix.ext }}
          chmod +x bin_dist/${{ matrix.bin_name }}${{ matrix.ext }}

      - name: Rename and move binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin_dist
          mv dist/vigilo.exe bin_dist/${{ matrix.bin_name }}${{ matrix.ext }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: bin_dist/

  create-github-release:
    name: Create GitHub Release
    needs: [build-pypi, build-executables]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PyPI dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: release-assets/

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-binaries/
          merge-multiple: true

      - name: Assemble release assets & compute checksums
        run: |
          mkdir -p release-assets/
          cp release-binaries/* release-assets/ || true
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
